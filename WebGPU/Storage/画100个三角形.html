<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <canvas width="800" height="800"></canvas>
  <script>
    // 编写着色器代码
    // 传递着色器给渲染管线
    // 
    async function main() {
      const adapter = await navigator.gpu?.requestAdapter()
      const device = await adapter?.requestDevice()
      if (!device) {
        fail("need a browser that supports WebGPU")
        return
      }

      // Get a WebGPU context from the canvas and configure it
      const canvas = document.querySelector("canvas")
      const context = canvas.getContext("webgpu")
      const presentationFormat = navigator.gpu.getPreferredCanvasFormat()
      context.configure({
        device,
        format: presentationFormat
      })

      const module = device.createShaderModule({
        code: `
         struct BaseStruct {
          color: vec4f,
          scale: vec2f,
          offset: vec2f
         }
        @group(0) @binding(0) var<uniform> baseStruct: BaseStruct;

        @vertex fn vs(@builtin(vertex_index) vertexIndex : u32) -> @builtin(position) vec4f {
          var pos = array<vec2f, 3>(
              vec2f( 0.0,  0.5),  // top center
              vec2f(-0.5, -0.5),  // bottom left
              vec2f( 0.5, -0.5)   // bottom right
          );
          return vec4f(pos[vertexIndex] * baseStruct.scale + baseStruct.offset, 0.0, 1.0);
        }

        @fragment fn fs() -> @location(0) vec4f {
          return baseStruct.color;
        }
        `
      })

      const rand = (min, max) => {
        if (min === undefined) {
          min = 0
          max = 1
        } else if (max === undefined) {
          max = min
          min = 0
        }
        return min + Math.random() * (max - min)
      }

      const uniformBufferSize = 4 * 4 + 4 * 2 + 4 * 2

      const colorOffset = 0
      const scaleOffset = 4
      const offset = 6
      const triangleCount = 100
      const objInfos = []

      const pipeline = device.createRenderPipeline({
        layout: 'auto',
        vertex: {
          module,
          entryPoint: 'vs'
        },
        fragment: {
          module,
          entryPoint: 'fs',
          targets: [{ format: presentationFormat }]
        }
      })

      for (let i = 0; i < triangleCount; i++) {
        const uniformBuffer = device.createBuffer({
          size: uniformBufferSize,
          usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.UNIFORM
        });

        const uniformValues = new Float32Array(uniformBufferSize / 4);

        uniformValues.set([1, 0, 1, 1], colorOffset);
        uniformValues.set([rand(-1, 1), rand(-1, 1)], offset);

        const bindGroup = device.createBindGroup({
          layout: pipeline.getBindGroupLayout(0),
          entries: [{
            binding: 0,
            resource: {
              buffer: uniformBuffer
            }
          }]
        })

        objInfos.push({
          bindGroup,
          uniformBuffer,
          uniformValues,
          scale: rand(0.2, 0.6)
        })
      }


      const renderPass = {
        colorAttachments: [
          {
            view: context
              .getCurrentTexture()
              .createView(),
            clearValue: [0.3, 0.3, 0.3, 1],
            loadOp: 'clear',
            storeOp: 'store',

          }
        ]
      }

      function render() {
        const encoder = device.createCommandEncoder();

        const pass = encoder.beginRenderPass(renderPass);

        pass.setPipeline(pipeline);

        for (let i = 0; i < triangleCount; i++) {
          const objInfo = objInfos[i];
          // bindGroup 需要与 buffer 一一绑定，实时更新，更新数据再进行绘制
          objInfo.uniformValues.set([objInfo.scale, objInfo.scale], scaleOffset)
          device.queue.writeBuffer(objInfo.uniformBuffer, 0, objInfo.uniformValues)
          pass.setBindGroup(0, objInfo.bindGroup)
          pass.draw(3) // call our vertex shader 3 times.
        }
        pass.end();
        const commandBuffer = encoder.finish();
        device.queue.submit([commandBuffer]);
      }
      render();
    }
    main();
  </script>
</body>

</html>
